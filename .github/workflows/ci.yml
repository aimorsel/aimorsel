# 跨平台 CI：三大平台（含 macOS x86_64）× 新旧 Python，装 Temurin Java 跑全量 pytest。
# 集成测试依赖 java——CI 里始终有；本地没装 java 时那部分自动跳过。
# 最低 Python 3.10：底层 opendataloader-pdf>=2.5.0 要求 >=3.10（CI 实测 3.9 装不上）。
# Intel macOS 用 macos-15-intel：macos-13 已退役，任务会永远排队（CI 实测卡 50 分钟）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 安装依赖（可编辑安装，顺带验证 pyproject 的依赖与 extras 可解析）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: 运行测试
        run: pytest
      - name: 构建 wheel 并从 wheel 安装冒烟（PyPI 包真能装、命令真能起）
        run: |
          pip install build
          python -m build --outdir dist/pypi
          pip install --force-reinstall --no-deps dist/pypi/*.whl
          cd "${RUNNER_TEMP}"
          morsel --version
          morsel web --help
          morsel mcp --help
          python -m aimorsel --help
